name: pocket_dent_scanner
description: MVP mobile app for PDR dent detection using structured light from phone screen.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

  # Navigation
  go_router: ^14.8.1

  # Storage
  drift: ^2.20.3
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4

  # Camera
  camera: ^0.11.0+2
  permission_handler: ^11.3.1

  # Screen wakelock — keeps display on during scan (screen is the light source)
  wakelock_plus: ^1.2.8

  # Code generation models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code generation
  build_runner: ^2.4.12
  freezed: ^4.0.1
  json_serializable: ^6.8.0
  riverpod_generator: ^4.0.9
  drift_dev: ^2.20.3

  # Linting
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
